version: '3.8'

services:
  # ── MySQL Database ────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: canteen-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-canteen_root_pass}
      MYSQL_DATABASE: campus_canteen
      MYSQL_USER: canteen_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-canteen_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js Backend API ───────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: canteen-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql://canteen_user:${MYSQL_PASSWORD:-canteen_pass}@db:3306/campus_canteen
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET}
      NODE_ENV: production
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend ───────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: canteen-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  # ── Python AI Service ────────────────────────────────────────
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: canteen-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET}
      BACKEND_URL: http://api:5000
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}

  # ── Redis (optional) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: canteen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - with-redis

volumes:
  mysql_data:
